{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="panel auth">
  <h1>Crear cuenta</h1>
  <form method="post">
    <label for="name">Nombre</label>
    <input id="name" name="name" required autofocus maxlength="80">
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required maxlength="120">
    <label for="password">Contraseña (mínimo 6 caracteres)</label>
    <input id="password" name="password" type="password" required minlength="6">
    <label for="confirmar">Repite la contraseña</label>
    <input id="confirmar" name="confirmar" type="password" required minlength="6">
    <div class="actions"><button class="btn" type="submit">Crear cuenta</button></div>
  </form>
  <p class="hint">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
</div>
{% endblock %}
